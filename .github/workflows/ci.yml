name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      # Sonar reads report paths from the repo root.
      - run: sed -i 's#^SF:#SF:web/#' coverage/lcov.info
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: web/coverage/lcov.info
          retention-days: 3

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: api/coverage.out
          retention-days: 3

  pay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pay
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: pcov
      - uses: actions/cache@v4
        with:
          path: pay/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('pay/composer.lock') }}
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit --coverage-clover coverage/clover.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-pay
          path: pay/coverage/clover.xml
          retention-days: 3

  # SonarQube Cloud analysis with the three coverage reports. The job fails when
  # the quality gate fails (sonar.qualitygate.wait in sonar-project.properties).
  sonar:
    needs: [web, api, pay]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage-web
          path: web/coverage
      - uses: actions/download-artifact@v4
        with:
          name: coverage-api
          path: api
      - uses: actions/download-artifact@v4
        with:
          name: coverage-pay
          path: pay/coverage
      - uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
